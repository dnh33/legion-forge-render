name: Render reliquaries and vistas
# Free, public image pipeline for Legion's War Room art.
# FLUX.1-schnell (Apache-2.0, Black Forest Labs) as a Q4 GGUF, run on CPU by stable-diffusion.cpp (MIT).
on:
  workflow_dispatch:
    inputs:
      set:      {description: "busts, vistas, frames (style exploration) or all", default: "all", type: choice, options: [all, busts, vistas, frames]}
      only:     {description: "Comma-separated ids (e.g. marshal,foundry-3). Empty = every item in the set", default: "", type: string}
      variants: {description: "Seeds per item", default: "1", type: string}
      steps:    {description: "Sampling steps (schnell is made for 4)", default: "4", type: string}
      shards:   {description: "Parallel jobs (each downloads the models once)", default: "12", type: string}
      runner:   {description: "Runner image. macOS arm64 runners have no GPU access in the VM and 7 GB RAM: slow and experimental", default: "ubuntu-latest", type: choice, options: [ubuntu-latest, macos-15, macos-14]}
permissions:
  contents: write
concurrency: {group: render, cancel-in-progress: false}
env:
  SD_TAG: master-945-a1ded76
  HF: https://huggingface.co
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: "${{ steps.p.outputs.matrix }}"}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env: {SET: "${{ inputs.set }}", ONLY: "${{ inputs.only }}", SHARDS: "${{ inputs.shards }}", VARIANTS: "${{ inputs.variants }}"}
        run: python3 scripts/plan.py

  render:
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h .
      - name: stable-diffusion.cpp (prebuilt, Linux)
        if: runner.os == 'Linux'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release download "$SD_TAG" -R leejet/stable-diffusion.cpp --pattern '*bin-Linux-Ubuntu-24.04-x86_64.zip' -O sd.zip
          unzip -q sd.zip -d sd && chmod +x sd/sd-cli && echo "LD_LIBRARY_PATH=$PWD/sd" >> "$GITHUB_ENV"
      - name: stable-diffusion.cpp (build, macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --recursive -b "$SD_TAG" https://github.com/leejet/stable-diffusion.cpp sdsrc
          cmake -S sdsrc -B sdsrc/build -DCMAKE_BUILD_TYPE=Release -DSD_METAL=OFF && cmake --build sdsrc/build -j 3
          mkdir -p sd && cp sdsrc/build/bin/sd-cli sd/ 2>/dev/null || cp sdsrc/build/bin/sd sd/sd-cli
      - name: Models (FLUX.1-schnell Q4_K_S, T5 Q4_K_M, CLIP-L, FLUX VAE)
        run: |
          mkdir -p models && cd models
          get(){ curl -fL --retry 5 --retry-delay 10 -o "$1" "$HF/$2"; }
          get flux.gguf         city96/FLUX.1-schnell-gguf/resolve/main/flux1-schnell-Q4_K_S.gguf &
          get t5.gguf           city96/t5-v1_1-xxl-encoder-gguf/resolve/main/t5-v1_1-xxl-encoder-Q4_K_M.gguf &
          get clip_l.safetensors comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors &
          get ae.safetensors    Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/vae/ae.safetensors &
          wait; ls -la
      - name: Render
        env: {ITEMS: "${{ matrix.items }}", VARIANTS: "${{ inputs.variants }}", STEPS: "${{ inputs.steps }}", SD_BIN: "./sd/sd-cli"}
        run: python3 scripts/render.py
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: "render-${{ matrix.shard }}", path: out/, if-no-files-found: warn, retention-days: 30}

  publish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with: {pattern: "render-*", path: dl, merge-multiple: true}
      - name: Commit to the renders branch
        run: |
          set -e
          cp scripts/sheet.py /tmp/sheet.py
          git config user.name "render-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin renders >/dev/null; then git checkout renders; else git checkout --orphan renders; git rm -rf --quiet . || true; fi
          mkdir -p renders/busts renders/vistas
          mkdir -p renders/frames
          for f in dl/*; do b=$(basename "$f"); case "$b" in busts-*) cp "$f" renders/busts/;; vistas-*) cp "$f" renders/vistas/;; frames-*) cp "$f" renders/frames/;; esac; done
          python3 -m pip install --quiet --break-system-packages pillow && python3 /tmp/sheet.py
          git add renders && (git commit -m "Renders from run ${{ github.run_id }}" && git push origin renders) || echo "Nothing new"
