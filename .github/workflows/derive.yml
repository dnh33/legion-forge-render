name: Derive animation layers
# After every render run: cut-out (rembg u2net), depth map (Depth-Anything V2 Small, Apache-2.0) and glow mask
# for each new image on the renders branch. These layers drive the animated portraits and parallax backdrops.
on:
  workflow_run:
    workflows: ["Render reliquaries and vistas"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: derive, cancel-in-progress: false}
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: {path: main}
      - uses: actions/checkout@v7
        with: {ref: renders, path: out}
      - name: Tools (CPU)
        run: |
          python3 -m pip install --quiet --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet --break-system-packages "rembg[cpu]" transformers pillow numpy
      - name: Derive
        working-directory: out
        run: python3 ../main/scripts/derive.py renders
      - name: Commit
        working-directory: out
        run: |
          git config user.name "render-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders && (git commit -m "Layers for run ${{ github.event.workflow_run.id || github.run_id }}" && git push origin renders) || echo "Nothing new"
